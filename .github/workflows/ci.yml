# CI gates, mirroring `make check` (fmt --all --check, clippy --workspace
# --all-targets -- -D warnings, cargo test --workspace) on the pinned
# toolchain (1.98.1), plus the `make deny` dependency audit.
#
# Strictly read-only: contents: read, persist-credentials: false, no secrets.
#
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes the stale gates.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Draft PRs do not gate; the ready_for_review trigger runs the gates once
    # a draft is marked ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; toolchain pinned below
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: check + clippy (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; toolchain pinned below
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Red gates cache too: an iterating PR keeps its dependency set
          # warm instead of paying a cold rebuild per fix push.
          cache-on-failure: true
      # --locked everywhere: the lockfile is committed, so a change to
      # Cargo.toml without its lockfile fails here.
      # --all-targets compiles the test/bench/example targets the release
      # build never touches.
      - name: Check (workspace, all targets, locked)
        run: cargo check --workspace --all-targets --locked
      - name: Clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1 action pin; toolchain pinned below
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Install uv (the kernel tests bootstrap the Python kernel venv with it)
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The e2e suites look the workspace bins up in the profile dir.
      - name: Build the workspace bins
        run: cargo build --locked --workspace --bins
      # The kernel e2e suites resolve the ambient kernel venv; left to
      # bootstrap lazily, the first session prewarm starts it mid-suite and
      # the next kernel test fails against the half-built venv. The
      # bootstrap entry point readies it first.
      - name: Bootstrap the kernel venv (ready before the kernel e2e tests)
        run: ./target/debug/unharnessed --unharnessed-bootstrap
      - name: Test (workspace)
        run: cargo test --workspace --locked

  # The dependency audit: the same advisories + licenses check as
  # `make deny` (deny.toml). Advisories that are triaged-unmaintained carry
  # an `ignore` entry with the reason and a review date; the gate fails on
  # anything new.
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency audit (cargo-deny advisories + licenses)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace
          command-arguments: advisories licenses
